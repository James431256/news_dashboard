<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="header-container">
            <div class="logo">
                <span class="logo-mark">N</span>
                <span class="logo-text">News Dashboard</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container">

        <section class="search-panel">
            <p class="section-kicker">SEARCH THE NEWS</p>
            <form id="search-form" onsubmit="handleSearch(event)">
                <div class="search-bar-row">
                    <div class="input-group search-input-group">
                        <i class="fa-solid fa-magnifying-glass input-icon"></i>
                        <input type="text" id="query-input" placeholder="Search for a topic or keyword" required>
                    </div>

                    <div class="input-group select-group">
                        <select id="category-select">
                            <option value="all">All Categories</option>
                            <option value="technology">Technology</option>
                            <option value="business">Business & Finance</option>
                            <option value="science">Science</option>
                            <option value="politics">Politics</option>
                            <option value="general">General News</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary" id="search-btn">
                        <i class="fa-solid fa-magnifying-glass"></i> Search
                    </button>
                </div>
            </form>

        </section>

        <!-- Loading State -->
        <div id="loading-state" class="state-container" style="display: none;">
            <div class="spinner"></div>
            <p>Loading stories...</p>
        </div>

        <!-- Error State -->
        <div id="error-state" class="state-container error-card" style="display: none;">
            <i class="fa-solid fa-triangle-exclamation state-icon"></i>
            <h4 id="error-title">Unable to load stories</h4>
            <p id="error-message">Something went wrong while retrieving articles.</p>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="state-container" style="display: none;">
            <i class="fa-regular fa-newspaper state-icon"></i>
            <h4>No stories found</h4>
            <p>Try another search or choose a different category. A source may also be unavailable or rate-limited.</p>
        </div>

        <!-- Articles Grid -->
        <section id="articles-container" class="articles-grid">
            <!-- Dynamically populated article cards -->
        </section>

    </main>

    <footer class="footer">
        <p>News from The Guardian and GNews</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
